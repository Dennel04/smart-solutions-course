; Smart Solutions Lab 2 — local XIAO ESP32S3 Sense tool camera.
; Versions are pinned to the toolchain already used by this repository.

[platformio]
default_envs = seeed_xiao_esp32s3

[env:seeed_xiao_esp32s3]
platform = espressif32@6.13.0
board = seeed_xiao_esp32s3
framework = arduino

monitor_speed = 115200
board_build.partitions = default_8MB.csv

build_flags =
    -DCORE_DEBUG_LEVEL=1

[env:native]
platform = native@1.2.1
test_framework = unity
test_build_src = yes
build_src_filter =
    +<core/>
build_flags =
    -std=gnu++17
