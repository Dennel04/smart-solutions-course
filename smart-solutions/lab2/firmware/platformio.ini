; Smart Solutions Lab 2 — AtomS3R post-office foundation.
; Board, platform, partition layout and dependency versions follow the
; hardware-tested Lab 1 PlatformIO project.

[platformio]
default_envs = atoms3r

[env:atoms3r]
platform = espressif32@^6.5.0
board = m5stack-atoms3
framework = arduino

monitor_speed = 115200
upload_speed = 1500000

board_build.partitions = default_8MB.csv
board_build.filesystem = littlefs

build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DARDUINO_USB_CDC_ON_BOOT=1

lib_deps =
    m5stack/M5Unified@^0.2.0
    bblanchon/ArduinoJson@^7.2.0

[env:native]
platform = native
test_framework = unity
test_build_src = yes
build_src_filter =
    +<core/>
build_flags =
    -std=gnu++17
