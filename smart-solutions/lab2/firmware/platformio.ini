; Smart Solutions Lab 2 — AtomS3R post-office foundation.
; Board, platform, partition layout and dependency versions follow the
; hardware-tested Lab 1 PlatformIO project.

[platformio]
default_envs = atoms3r

[env:atoms3r]
platform = espressif32@^6.5.0
board = m5stack-atoms3
framework = arduino

monitor_speed = 115200
upload_speed = 1500000

board_build.partitions = default_8MB.csv
board_build.filesystem = littlefs

build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBENCH_MODE=1
    -Wl,--wrap=nvs_flash_init
    -Wl,--wrap=nvs_flash_init_partition
    -Wl,--wrap=nvs_open
    -Wl,--wrap=nvs_open_from_partition
    -Wl,-u,__wrap_nvs_flash_init
    -Wl,-u,__wrap_nvs_flash_init_partition
    -Wl,-u,__wrap_nvs_open
    -Wl,-u,__wrap_nvs_open_from_partition

; The first-upload binary cannot link the post-office/store/serial bridge.
build_src_filter =
    -<*>
    +<bench_main.cpp>
    +<bench_nvs_guard.cpp>
    +<core/pressure_model.cpp>

lib_deps =
    m5stack/M5Unified@^0.2.0
    bblanchon/ArduinoJson@^7.2.0

; Never select this for the isolated first boot. No web/NVS flag enables it.
[env:atoms3r_normal]
extends = env:atoms3r
build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBENCH_MODE=0
build_src_filter =
    +<*>
    -<bench_main.cpp>
    -<bench_nvs_guard.cpp>

[env:native]
platform = native
test_framework = unity
test_build_src = yes
build_src_filter =
    +<core/>
build_flags =
    -std=gnu++17

; One USB-authorised HTTPS health request. Never the default environment.
[env:atoms3r_health]
extends = env:atoms3r
; Match the libraries in the hardware-tested BENCH build, not newer releases.
lib_deps =
    m5stack/M5Unified@0.2.25
    m5stack/M5GFX@0.2.32
    bblanchon/ArduinoJson@7.4.3
build_unflags = -DCORE_DEBUG_LEVEL=1
build_flags =
    ${env:atoms3r.build_flags}
    -DHEALTH_ONLY=1
    -DCORE_DEBUG_LEVEL=0
build_src_filter =
    -<*>
    +<health_only_main.cpp>
    +<bench_nvs_guard.cpp>
